# File: pyproject.toml
# Version: 0.1.0
# Last modified: 2026-11-19 (XD)
# Change: Package metadata so `pip install -e .` provides the `seqseec` command.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seqseec"
version = "0.1.0"
description = "RNA-seq strandedness from lab notes and reads, with downstream tool settings"
requires-python = ">=3.10"
dependencies = []          # standard library only so far

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
seqseec = "seqseec.cli:main"

[tool.setuptools]
packages = ["seqseec"]     # prompts/ sits next to the package, so install with -e (editable)
