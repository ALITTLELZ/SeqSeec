# File: pyproject.toml
# Version: 0.5.0
# Last modified: 2026-11-20 (Track B)
# Change: Version 0.5.0, matching the prototype spec sheet v0.5.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seqseec"
version = "0.5.0"
description = "RNA-seq strandedness from lab notes and reads, with downstream tool settings"
requires-python = ">=3.10"
dependencies = []          # standard library only so far

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
seqseec = "seqseec.cli:main"

[tool.setuptools]
packages = ["seqseec"]     # prompts/ sits next to the package, so install with -e (editable)
